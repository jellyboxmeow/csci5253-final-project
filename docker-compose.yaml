services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: phishguard
      POSTGRES_DB: phishguard
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard"]
      interval: 3s
      retries: 20

  phishguard:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://phishguard:phishguard@db:5432/phishguard
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PHISHGUARD_SANDBOX_IMAGE: phishguard-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets the orchestrator launch sandboxes
    ports: ["5000:5000"]

volumes:
  pgdata: {}
